name: mpw_precheck

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['gds']
    types: [completed]

jobs:
  mpw_precheck:
    env:
      PYTHONIOENCODING: utf-8
      PDK_ROOT: ${{ github.workspace }}/IHP-Open-PDK
      PDK: ihp-sg13cmos5l

    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install KLayout
        shell: bash
        run: |
          wget https://github.com/TinyTapeout/klayout/releases/download/v0.29.12/klayout_0.29.12-1_amd64.deb
          sudo apt-get update && sudo apt-get install -y ./klayout_0.29.11-1_amd64.deb

      - name: Download artifact (run id = ${{ github.event.workflow_run.id }})
        uses: dawidd6/action-download-artifact@v24
        id: download_artifact
        with:
          workflow: gds.yaml
          run_id: ${{ github.event.workflow_run.id }}
          workflow_conclusion: success
          name: foundry_submission
          path: tinytapeout-submission

      # There's no IHP TO_* precheck repo for sg13cmos5l, so run the PDK's minimum
      # (foundry precheck) rule set instead.
      - name: Run DRC check
        working-directory: tinytapeout-submission
        env:
          PYTHONPATH: /usr/lib/klayout/pymod
        run: |
          set +e
          python3 $PDK_ROOT/$PDK/libs.tech/klayout/tech/drc/run_drc.py \
            --path=gds/tt_ihp_wrapper_final.gds \
            --topcell=tt_ihp_wrapper \
            --run_dir=drc_results \
            --minimum_drc --no_density 2>&1 | tee tt_ihp_wrapper_final.gds.log
          DRC_STATUS=${PIPESTATUS[0]}
          set -e

          cp drc_results/*_full.lyrdb tt_ihp_wrapper_final.gds.lyrdb || true

          if [ $DRC_STATUS -ne 0 ]; then
            echo "## ❌ DRC errors found in the design" | tee -a $GITHUB_STEP_SUMMARY
            grep "Violated rules" tt_ihp_wrapper_final.gds.log | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ DRC check passed" | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload precheck results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precheck_results
          path: |
            tinytapeout-submission/tt_ihp_wrapper_final.gds.lyrdb
            tinytapeout-submission/tt_ihp_wrapper_final.gds.log

  density_check:
    env:
      PDK_ROOT: ${{ github.workspace }}/IHP-Open-PDK
      PDK: ihp-sg13cmos5l
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install KLayout
        shell: bash
        run: |
          wget https://github.com/TinyTapeout/klayout/releases/download/v0.29.12/klayout_0.29.12-1_amd64.deb
          sudo apt-get update && sudo apt-get install -y ./klayout_0.29.11-1_amd64.deb

      - name: Download artifact (run id = ${{ github.event.workflow_run.id }})
        uses: dawidd6/action-download-artifact@v24
        id: download_artifact
        with:
          workflow: gds.yaml
          run_id: ${{ github.event.workflow_run.id }}
          workflow_conclusion: success
          name: foundry_submission
          path: ihp

      - name: Run Density check
        working-directory: ihp
        env:
          PYTHONPATH: /usr/lib/klayout/pymod
        run: |
          set +e
          python3 $PDK_ROOT/$PDK/libs.tech/klayout/tech/drc/run_drc.py \
            --path=gds/tt_ihp_wrapper_final.gds \
            --topcell=tt_ihp_wrapper \
            --run_dir=density_results \
            --density_only --density_thr=4 2>&1 | tee density_report.log
          DENSITY_STATUS=${PIPESTATUS[0]}
          set -e

          cp density_results/*_full.lyrdb density_report.xml || true

          if [ $DENSITY_STATUS -ne 0 ]; then
            echo "## ❌ Density errors found in the design" | tee -a $GITHUB_STEP_SUMMARY
            grep "Violated rules" density_report.log | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Density check passed" | tee -a $GITHUB_STEP_SUMMARY

      - name: Upload density check results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: density_check_results
          path: |
            ihp/density_report.xml
            ihp/density_report.log
